spring:
  main:
    web-application-type: none
  application:
    name: commerce-relay
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
  kafka:
    producer:
      properties:
        max.block.ms: 5000

outbox:
  relay:
    enabled: true
    poll-interval: 1s
    batch-size: 100
    max-rounds-per-tick: 10
    max-attempts: 10
    backoff-initial: 1s
    backoff-max: 60s
    # delivery.timeout.ms(120초)보다 길어야 보내는 중인 행을 다른 relay 가 가져가지 않음
    lease: 150s
    # 같은 순간 선점하는 relay 들이 나눠 가질 후보 수, batch-size x 동시에 도는 relay 수 이상
    candidate-size: 300

---
spring:
  config:
    activate:
      on-profile: test

# 테스트가 relay 한 회차를 직접 호출
outbox:
  relay:
    enabled: false

# 스키마는 commerce-api 가 생성, relay 는 매핑이 맞는지만 확인
---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: validate

outbox:
  relay:
    batch-size: 10
    candidate-size: 30

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd
