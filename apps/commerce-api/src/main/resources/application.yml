server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

product:
  stats:
    cron: ${PRODUCT_STATS_CRON:0 0 4 * * *}

order-event:
  topic: ${ORDER_EVENTS_TOPIC:order.events.v1}
  schema-version: ${ORDER_EVENTS_SCHEMA_VERSION:1}

pg:
  base-url: ${PG_BASE_URL:http://localhost:8082}
  connect-timeout: ${PG_CONNECT_TIMEOUT:1s}
  read-timeout: ${PG_READ_TIMEOUT:3s}

resilience4j:
  circuitbreaker:
    instances:
      pg:
        # 판정 창을 호출 수로 셀지 시간으로 셀지
        sliding-window-type: COUNT_BASED
        # 판정에 쓰는 창 크기. COUNT_BASED 면 호출 수
        sliding-window-size: ${PG_CB_WINDOW:20}
        # 이 수를 채우기 전에는 판정하지 않는다
        minimum-number-of-calls: ${PG_CB_MIN_CALLS:10}
        # 실패율이 이 % 를 넘으면 열린다
        failure-rate-threshold: ${PG_CB_FAILURE_RATE:50}
        # 이 시간을 넘긴 호출을 "느린 호출" 로 센다
        slow-call-duration-threshold: ${PG_CB_SLOW_CALL:2s}
        # 느린 호출 비율이 이 % 를 넘으면 열린다
        slow-call-rate-threshold: ${PG_CB_SLOW_RATE:50}
        # 열린 상태를 유지하는 시간
        wait-duration-in-open-state: ${PG_CB_OPEN_WAIT:10s}
        # half-open 에서 시험 삼아 보내는 호출 수
        permitted-number-of-calls-in-half-open-state: 3
        # 호출이 없어도 스스로 half-open 으로 넘어갈지
        automatic-transition-from-open-to-half-open-enabled: true
        # 실패로 세는 예외
        record-exceptions:
          - org.springframework.web.client.RestClientException
        # 세지 않는 예외. record 보다 먼저 적용된다
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false