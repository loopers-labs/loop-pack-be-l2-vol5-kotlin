server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml
  kafka:
    producer:
      properties:
        max.block.ms: 5000

commerce:
  pg:
    # 로컬 테스트 PG 계약, 고객 입력으로 바꾸지 않음
    base-url: http://127.0.0.1:8082
    callback-url: http://127.0.0.1:8080/api/v1/payments/callback
    user-id: "135135"
    connect-timeout: 1s
    read-timeout: 3s

coupon:
  fixture:
    enabled: false
  admission:
    capacity: 3
  stream:
    prefix: coupon:reservations
    control-prefix: coupon:stream:control
  consumer:
    group: coupon-issuers
  operations:
    enabled: false
    username: ${COUPON_OPERATIONS_USERNAME:coupon-operator}
    password: ${COUPON_OPERATIONS_PASSWORD:}

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

server:
  address: 127.0.0.1 # 로컬 실습 전용. 외부에 공개하지 않는다.

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: update

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
